name: terraform apply

# AUTO-TRIGGER ON PUSH IS DISABLED until the project migrates to S3 remote
# state (see infra/_backend/README.md). With local state, the runner starts
# empty each run and would try to re-create resources that already exist —
# half-fails with "already exists" errors and leaves things in a worse state.
#
# Until then: trigger manually via `gh workflow run "terraform apply" --ref main \
#   -f phase=infra/02-workload-dev` AFTER you've migrated the relevant phase.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Exact phase directory to apply'
        required: true
        type: choice
        options:
          - infra/00-org-bootstrap
          - infra/01-security-baseline
          - infra/02-workload-dev
          - infra/03-dr-pilot-light
          - infra/04-edge-and-data
          - infra/06-cost-controls
          - infra/07-cicd
          - infra/08-dns-delegation
          - infra/_backend
      confirmation:
        description: 'Type the selected phase path exactly after reviewing target account and state'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    if: inputs.confirmation == inputs.phase
    name: apply ${{ github.event.inputs.phase }}
    runs-on: ubuntu-latest
    # GitHub Environment provides the manual approval gate. Configure required
    # reviewers in repo settings → Environments → "production". Until that's
    # configured the apply runs without a gate, which is fine for solo work
    # but unsafe for a team.
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: setup terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.15.8

      - name: configure AWS via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-2
          role-session-name: gh-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ github.event.inputs.phase }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ github.event.inputs.phase }}
        run: terraform apply -auto-approve -input=false
